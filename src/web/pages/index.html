<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>AppTask Auditor</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; }
      label { display: block; margin-top: 1rem; }
      input { width: 100%; padding: 0.5rem; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; }
    </style>
  </head>
  <body>
    <h1>AppTask Auditor</h1>
    <p>Каркас UI. Запуск аудита будет подключён к <code>run-audit</code>.</p>
    <form id="audit-form">
      <label>
        Board URL
        <input name="boardUrl" type="url" placeholder="https://apptask.ru/c/7/board/445" />
      </label>
      <label>
        Discord Webhook URL
        <input name="webhookUrl" type="url" placeholder="https://discord.com/api/webhooks/..." />
      </label>
      <button type="submit" disabled>Run audit (soon)</button>
    </form>
  </body>
</html>
